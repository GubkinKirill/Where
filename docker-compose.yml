services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # только в локальной сети; наружу приложение не выставляется
      - "8000:8000"
    env_file: .env
    environment:
      # пути внутри контейнера, поверх значений из .env
      DB_PATH: /app/data/inventory.db
      PHOTO_DIR: /app/data/photos
    volumes:
      # база и фотографии переживают пересборку образа
      - inventory-data:/app/data

volumes:
  inventory-data:
