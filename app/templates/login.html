<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Учёт техники</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-page">
  <h1>Учёт техники</h1>
  <div class="sub">Вход в систему</div>

  {% if error %}<div class="flash flash--error">{{ error }}</div>{% endif %}

  <section class="card">
    <div class="card__body">
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-row">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
        </div>
        <div class="form-row">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary" style="width:100%; justify-content:center" type="submit">Войти</button>
      </form>
    </div>
  </section>

  <p style="font-size:13px">
    Сотруднику с учётной записью — тот же вход: он ведёт в личный кабинет.
  </p>
  <p style="font-size:13px">
    <a href="/my">Учётной записи нет — посмотреть свою технику по табельному номеру</a>
  </p>
  <p style="font-size:13px">
    <a href="/help">Справка: как работает система</a>
  </p>
</div>
</body>
</html>
