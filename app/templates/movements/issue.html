{% extends "base.html" %}
{% set section = 'items' %}
{% block title %}Выдача {{ item.inv_number }} — Учёт техники{% endblock %}

{% block content %}
<div class="crumbs"><a href="/items">Единицы</a> / <a href="/items/{{ item.id }}">{{ item.inv_number }}</a> / выдача</div>
<h1 style="margin-bottom:16px">Выдать сотруднику</h1>

<section class="card" style="max-width:560px">
  <div class="card__body">
    <div class="subject">
      <span class="inv" style="font-size:16px">{{ item.inv_number }}</span>
      <span>{{ item.name }}</span>
    </div>

    <form method="post" action="/items/{{ item.id }}/issue">
      <input type="hidden" name="loc_kind" value="person">

      <div class="form-row">
        <label for="employee_id">Кому <span class="req">*</span></label>
        <select id="employee_id" name="employee_id" required autofocus>
          <option value="">— выберите сотрудника —</option>
          {% for employee in employees %}
            <option value="{{ employee.id }}">
              {{ employee.short_name }}{% if employee.position %} · {{ employee.position }}{% endif %}
              {%- if employee.default_room %} · каб. {{ employee.default_room.number }}{% endif %}
            </option>
          {% endfor %}
        </select>
      </div>

      <details class="more">
        <summary>Дополнительно</summary>
        <div style="padding-top:10px">
          <div class="form-row">
            <label for="room_id">Кабинет</label>
            <select id="room_id" name="room_id">
              <option value="">— как в карточке сотрудника —</option>
              {% for room in rooms %}
                <option value="{{ room.id }}">{{ room.number }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-row">
            <label for="expected_return_date">Ожидаемый возврат</label>
            <input type="date" id="expected_return_date" name="expected_return_date">
          </div>
          <div class="form-row">
            <label for="comment">Комментарий</label>
            <textarea id="comment" name="comment" rows="2" placeholder="Взамен вышедшего из строя"></textarea>
          </div>
        </div>
      </details>

      <div class="actions">
        <button class="btn btn--primary" style="flex:1; justify-content:center" type="submit">Выдать</button>
        <a class="btn" href="/items/{{ item.id }}">Отмена</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
